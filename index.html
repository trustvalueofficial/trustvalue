<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work In Progress</title>
  <meta name="description" content="Something amazing is coming soon. A playful interactive coming-soon page.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0a0a0f;
      --text-warm: #fff8ee;
      --text-muted: rgba(255, 245, 230, 0.6);
      --accent: #ffe4b5;
      --glass-bg: rgba(12, 10, 18, 0.65);
      --glass-border: rgba(255, 240, 210, 0.12);
    }

    html {
      scroll-behavior: auto;
      background: var(--bg-dark);
    }

    body {
      background: var(--bg-dark);
      font-family: 'Inter', sans-serif;
      color: var(--text-warm);
      /* Generous scroll track for buttery frame scrubbing across 198 frames */
      height: 650vh;
      overflow-x: hidden;
    }

    /* === FIXED FULLSCREEN VIEWPORT === */
    #viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 1;
    }

    /* === FULLSCREEN CAT CANVAS (Layer 1) === */
    #cat-canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #cat-canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: contrast(1.04) brightness(0.96) saturate(1.08);
      transform: translateZ(0);
      will-change: transform;
    }

    /* Cinematic ambient lighting & dark gradient overlays */
    #ambient-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        /* Top gradient so text & countdown pop clearly */
        linear-gradient(180deg, rgba(8, 7, 12, 0.72) 0%, rgba(8, 7, 12, 0.35) 30%, rgba(8, 7, 12, 0.1) 60%, rgba(8, 7, 12, 0.65) 100%),
        /* Cinematic vignette */
        radial-gradient(circle at center, transparent 35%, rgba(6, 5, 10, 0.55) 100%);
    }

    /* === "WORK IN PROGRESS" FLOATING LAYER (Layer 3) === */
    #text-section {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      user-select: none;
    }

    #wip-text {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      line-height: 0.88;
      text-align: left;
      /* Powerful composite drop shadow for extreme depth and readability */
      filter:
        drop-shadow(0 4px 14px rgba(0, 0, 0, 0.98)) drop-shadow(0 14px 36px rgba(0, 0, 0, 0.9)) drop-shadow(0 28px 70px rgba(0, 0, 0, 0.8));
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    #wip-text span {
      font-family: 'Anton', Impact, sans-serif;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #ffffff;
      background: linear-gradient(180deg, #ffffff 0%, #f0e6d6 55%, #c8bbae 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 1px rgba(255, 255, 255, 0.4);
      position: relative;
      display: block;
    }

    /* Shimmer glow over text */
    #wip-text span::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      background: linear-gradient(110deg,
          transparent 20%,
          rgba(255, 255, 255, 0.6) 48%,
          rgba(255, 235, 200, 0.9) 50%,
          rgba(255, 255, 255, 0.6) 52%,
          transparent 80%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: textShine 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      pointer-events: none;
    }

    @keyframes textShine {

      0%,
      100% {
        background-position: 250% 0;
      }

      50% {
        background-position: -150% 0;
      }
    }

    /* === PARTICLES LAYER (Layer 4) === */
    #particles-layer {
      position: fixed;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      opacity: 0;
      will-change: transform, opacity;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
    }

    /* === COUNTDOWN OVERLAY (Top-Left, Layer 5) === */
    #countdown-overlay {
      position: fixed;
      top: 28px;
      left: 28px;
      z-index: 25;
      background: var(--glass-bg);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 16px 22px;
      min-width: 145px;
      pointer-events: none;
      user-select: none;
    }

    .days-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .days-num {
      font-family: 'Anton', Impact, sans-serif;
      font-size: 52px;
      line-height: 1;
      color: var(--accent);
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(255, 228, 181, 0.3);
    }

    .hms {
      font-family: 'Inter', monospace;
      font-size: 14px;
      font-weight: 700;
      color: rgba(255, 240, 220, 0.85);
      letter-spacing: 2px;
      margin-top: 4px;
    }

    /* === SMOOTH PROGRESS BAR (Top edge) === */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff9d42, #ffd166, #ff8c42);
      box-shadow: 0 0 12px rgba(255, 160, 60, 0.8);
      z-index: 40;
      width: 0%;
      will-change: width;
    }

    /* === FRAME COUNTER (Bottom-Right) === */
    #frame-counter {
      position: fixed;
      bottom: 26px;
      right: 28px;
      z-index: 25;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 8px 14px;
      font-family: 'Inter', monospace;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255, 245, 230, 0.8);
      letter-spacing: 1.5px;
      pointer-events: none;
      user-select: none;
    }

    /* === SCROLL INDICATOR HINT (Bottom-Center) === */
    #scroll-indicator {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
      user-select: none;
    }

    #scroll-indicator.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(12px);
    }

    .scroll-pill {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border-radius: 20px;
      padding: 7px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .scroll-text {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 245, 230, 0.75);
    }

    .scroll-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffd166;
      box-shadow: 0 0 8px #ffd166;
      animation: pulseDot 1.6s ease-in-out infinite;
    }

    @keyframes pulseDot {

      0%,
      100% {
        transform: scale(0.8);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.3);
        opacity: 1;
      }
    }

    /* === LOADING OVERLAY === */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #08070c;
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 200, 120, 0.12);
      border-top-color: #ffd166;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      box-shadow: 0 0 20px rgba(255, 209, 102, 0.2);
    }

    .loader-text {
      margin-top: 18px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
      #text-section {
        top: 7vh;
        height: 30vh;
      }

      #countdown-overlay {
        top: 16px;
        left: 16px;
        padding: 12px 16px;
        min-width: 120px;
      }

      .days-num {
        font-size: 38px;
      }

      .hms {
        font-size: 12px;
      }

      #frame-counter {
        bottom: 16px;
        right: 16px;
        padding: 6px 10px;
        font-size: 11px;
      }

      #scroll-indicator {
        bottom: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- Viewport with Fullscreen Canvas & Overlays -->
  <div id="viewport">
    <!-- Fullscreen Cat Canvas -->
    <div id="cat-canvas-container">
      <canvas id="cat-canvas"></canvas>
    </div>

    <!-- Ambient Light / Vignette / Contrast Overlay -->
    <div id="ambient-overlay"></div>

    <!-- "WORK IN PROGRESS" Text Layer with Drop Shadow -->
    <div id="text-section">
      <div id="wip-text">
        <span id="wip-w" data-text="WORK">WORK</span>
        <span id="wip-i" data-text="IN">IN</span>
        <span id="wip-p" data-text="PROGRESS">PROGRESS</span>
      </div>
    </div>
  </div>

  <!-- Floating Atmospheric Particles -->
  <div id="particles-layer"></div>

  <!-- Progress Bar -->
  <div id="progress-bar"></div>

  <!-- Countdown Overlay -->
  <div id="countdown-overlay">
    <div class="days-label">Days remaining</div>
    <div class="days-num" id="cd-days">90</div>
    <div class="hms" id="cd-hms">00 : 00 : 00</div>
  </div>

  <!-- Scroll Indicator -->
  <div id="scroll-indicator">
    <div class="scroll-pill">
      <div class="scroll-dot"></div>
      <span class="scroll-text">Scroll to animate</span>
    </div>
  </div>

  <!-- Frame Counter -->
  <div id="frame-counter">001 / 198</div>

  <!-- Loading Screen -->
  <div id="loading-overlay">
    <div class="loader-spinner"></div>
    <div class="loader-text">website is Loading … 0%</div>
  </div>

  <script>
    // ============================================================
    //  COUNTDOWN (90-day, persisted in localStorage)
    // ============================================================
    (function initCountdown() {
      const KEY = 'wip_target_date';
      let target;
      const stored = localStorage.getItem(KEY);
      if (stored) {
        target = new Date(stored);
        if (isNaN(target.getTime()) || target.getTime() <= Date.now()) {
          target = new Date(Date.now() + 90 * 24 * 60 * 60 * 1000);
          localStorage.setItem(KEY, target.toISOString());
        }
      } else {
        target = new Date(Date.now() + 90 * 24 * 60 * 60 * 1000);
        localStorage.setItem(KEY, target.toISOString());
      }

      const $days = document.getElementById('cd-days');
      const $hms = document.getElementById('cd-hms');

      function tick() {
        const diff = Math.max(0, target.getTime() - Date.now());
        const totalSec = Math.floor(diff / 1000);
        const d = Math.floor(totalSec / 86400);
        const h = Math.floor((totalSec % 86400) / 3600);
        const m = Math.floor((totalSec % 3600) / 60);
        const s = totalSec % 60;
        $days.textContent = d;
        $hms.textContent =
          String(h).padStart(2, '0') + ' : ' +
          String(m).padStart(2, '0') + ' : ' +
          String(s).padStart(2, '0');
      }
      tick();
      setInterval(tick, 1000);
    })();

    // ============================================================
    //  RESPONSIVE "WORK IN PROGRESS" TYPOGRAPHY & DYNAMIC POSITIONING
    // ============================================================
    const wipTextEl = document.getElementById('wip-text');

    function sizeWipText() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      // Sized to fit comfortably in both the green box area and bottom-right quadrant
      const base = Math.min(w * 0.15, h * 0.14);
      document.getElementById('wip-w').style.fontSize = base + 'px';
      document.getElementById('wip-i').style.fontSize = (base * 0.86) + 'px';
      document.getElementById('wip-p').style.fontSize = (base * 0.70) + 'px';
      updateWipTextPosition(lastProgress);
    }

    let lastProgress = 0;

    // Hermite smoothstep easing curve for natural, cinematic glide
    function smoothStep(edge0, edge1, x) {
      const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
      return t * t * (3 - 2 * t);
    }

    function updateWipTextPosition(progress) {
      lastProgress = progress;
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      if (!wipTextEl) return;

      const tw = wipTextEl.offsetWidth;
      const th = wipTextEl.offsetHeight;

      // Position 1 (Green Box: Upper-left, beside countdown timer)
      const x1 = Math.max(185, vw * 0.14);
      const y1 = Math.max(28, vh * 0.08);

      // Position 2 (Bottom-Right: lower-right quadrant, clear of edges)
      const x2 = Math.max(20, vw - tw - Math.max(35, vw * 0.05));
      const y2 = Math.max(20, vh - th - Math.max(45, vh * 0.08));

      // Smooth lerp between Position 1 and Position 2
      const curX = x1 + (x2 - x1) * progress;
      const curY = y1 + (y2 - y1) * progress;

      wipTextEl.style.transform = `translate3d(${curX}px, ${curY}px, 0)`;
    }

    sizeWipText();
    window.addEventListener('resize', sizeWipText);

    // ============================================================
    //  FLOATING ATMOSPHERIC PARTICLES
    // ============================================================
    (function initParticles() {
      const container = document.getElementById('particles-layer');
      const COUNT = 24;
      const particles = [];

      function makeShape() {
        const el = document.createElement('div');
        el.classList.add('particle');
        const isLeaf = Math.random() > 0.4;
        const size = 6 + Math.random() * 16;
        if (isLeaf) {
          el.style.width = size + 'px';
          el.style.height = (size * 1.7) + 'px';
          el.style.borderRadius = '65% 2% 65% 2%';
          const hue = 25 + Math.random() * 32;
          el.style.background = `hsla(${hue}, 55%, 45%, 0.45)`;
        } else {
          el.style.width = size + 'px';
          el.style.height = (size * 1.3) + 'px';
          el.style.borderRadius = '3px';
          el.style.background = `rgba(240, 230, 210, ${0.08 + Math.random() * 0.12})`;
        }
        container.appendChild(el);
        return el;
      }

      for (let i = 0; i < COUNT; i++) {
        const el = makeShape();
        particles.push({
          el,
          x: Math.random() * window.innerWidth,
          y: -30 - Math.random() * window.innerHeight,
          vx: 0.2 + Math.random() * 0.5,
          vy: 0.18 + Math.random() * 0.45,
          rot: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 1.2,
          wobbleAmp: 14 + Math.random() * 28,
          wobbleFreq: 0.004 + Math.random() * 0.006,
          phase: Math.random() * Math.PI * 2,
          opacity: 0.15 + Math.random() * 0.25,
        });
      }

      let frame = 0;
      function animateParticles() {
        frame++;
        const W = window.innerWidth, H = window.innerHeight;
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.rot += p.rotSpeed;
          const wobble = Math.sin(frame * p.wobbleFreq + p.phase) * p.wobbleAmp;
          if (p.x > W + 50) { p.x = -40; p.y = Math.random() * H; }
          if (p.y > H + 50) { p.y = -40; p.x = Math.random() * W; }
          p.el.style.transform = `translate(${p.x + wobble}px, ${p.y}px) rotate(${p.rot}deg)`;
          p.el.style.opacity = p.opacity;
        }
        requestAnimationFrame(animateParticles);
      }
      animateParticles();
    })();

    // ============================================================
    //  BUTTER-SMOOTH SCROLL-DRIVEN FRAME ENGINE
    // ============================================================
    const TOTAL_FRAMES = 198;
    const canvas = document.getElementById('cat-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const progressBar = document.getElementById('progress-bar');
    const frameCounter = document.getElementById('frame-counter');
    const scrollIndicator = document.getElementById('scroll-indicator');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loaderText = document.querySelector('.loader-text');

    const frames = [];
    let loadedCount = 0;
    let isReady = false;

    // Physics / Lerp state variables for Butter-Smooth Interpolation
    let targetFraction = 0;
    let smoothFraction = 0;
    let currentRenderedIndex = -1;
    const LERP_FACTOR = 0.10; // Silky-smooth easing speed

    function padNum(n) {
      return String(n).padStart(3, '0');
    }

    // Pre-decode & load all 198 frames from cat/ folder
    for (let i = 1; i <= TOTAL_FRAMES; i++) {
      const img = new Image();
      img.src = `cat/frame_${padNum(i)}.jpg`;
      img.onload = () => {
        loadedCount++;
        const pct = Math.round((loadedCount / TOTAL_FRAMES) * 100);
        loaderText.textContent = `Loading Cat Frames… ${pct}%`;
        if (loadedCount === TOTAL_FRAMES) {
          onAllFramesReady();
        }
      };
      img.onerror = () => {
        loadedCount++;
        if (loadedCount === TOTAL_FRAMES) {
          onAllFramesReady();
        }
      };
      frames.push(img);
    }

    function onAllFramesReady() {
      isReady = true;
      loadingOverlay.classList.add('hidden');
      setTimeout(() => loadingOverlay.remove(), 800);
      resizeCanvas();
      updateScrollTarget();
      smoothFraction = targetFraction;
      drawFrame(Math.round(smoothFraction * (TOTAL_FRAMES - 1)));
      startAnimationLoop();
    }

    // Fullscreen canvas sizing with DPR scaling
    let viewportW = window.innerWidth;
    let viewportH = window.innerHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resizeCanvas() {
      viewportW = window.innerWidth;
      viewportH = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.round(viewportW * dpr);
      canvas.height = Math.round(viewportH * dpr);
      canvas.style.width = viewportW + 'px';
      canvas.style.height = viewportH + 'px';

      // Force re-render current frame with updated dimensions
      if (currentRenderedIndex >= 0) {
        const idx = currentRenderedIndex;
        currentRenderedIndex = -1;
        drawFrame(idx);
      }
    }

    // Draw frame using high-performance cover algorithm
    function drawFrame(index) {
      if (index === currentRenderedIndex) return;
      currentRenderedIndex = index;

      const img = frames[index];
      if (!img || !img.complete || !img.naturalWidth) return;

      const cw = canvas.width;
      const ch = canvas.height;
      const iw = img.naturalWidth;
      const ih = img.naturalHeight;

      // Object-fit: cover sizing
      const scale = Math.max(cw / iw, ch / ih);
      const sw = iw * scale;
      const sh = ih * scale;
      const sx = (cw - sw) * 0.5;
      const sy = (ch - sh) * 0.5;

      ctx.drawImage(img, sx, sy, sw, sh);

      // Update HUD elements
      frameCounter.textContent = `${padNum(index + 1)} / ${padNum(TOTAL_FRAMES)}`;
      progressBar.style.width = `${(index / (TOTAL_FRAMES - 1)) * 100}%`;
    }

    // Scroll position listener
    function updateScrollTarget() {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      targetFraction = Math.max(0, Math.min(1, scrollTop / maxScroll));

      if (scrollTop > 40) {
        scrollIndicator.classList.add('hidden');
      } else {
        scrollIndicator.classList.remove('hidden');
      }
    }

    window.addEventListener('scroll', updateScrollTarget, { passive: true });
    window.addEventListener('resize', () => {
      sizeWipText();
      resizeCanvas();
    });

    // Continuous RAF loop that lerps smoothFraction -> targetFraction for butter smoothness
    function startAnimationLoop() {
      function render() {
        if (isReady) {
          // Lerp smooth fraction toward target scroll fraction
          const diff = targetFraction - smoothFraction;
          if (Math.abs(diff) > 0.0001) {
            smoothFraction += diff * LERP_FACTOR;
          } else {
            smoothFraction = targetFraction;
          }

          // Calculate corresponding frame index
          const currentFrameFloat = smoothFraction * (TOTAL_FRAMES - 1);
          const targetFrame = Math.round(currentFrameFloat);
          drawFrame(targetFrame);

          // Animate WIP text position from green box (frame 1..40) to bottom-right by frame 110
          const textTransitionProgress = smoothStep(40, 110, currentFrameFloat);
          updateWipTextPosition(textTransitionProgress);
        }
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    }
  </script>
</body>

</html>
